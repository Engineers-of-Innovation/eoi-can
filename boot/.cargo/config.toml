[target.'cfg(all(target_arch = "arm", target_os = "none"))']

runner = [ "probe-rs", "run", "--chip", "STM32L471RGTx", "--connect-under-reset", "--catch-reset", "--catch-hardfault", "--always-print-stacktrace", "--log-format", "{L} {t} {f}:{l} {s}", "--preverify", "--verify" ]

[build]
target = "thumbv7em-none-eabi"
