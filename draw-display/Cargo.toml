[package]
name = "draw-display"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
built = { version = "0.8", features = [ "git2" ] }

[features]
default = [ "std" ]
defmt = [ "dep:defmt", "eoi-can-decoder/defmt" ]
std = [ "tokio" ]
tokio = [ "dep:tokio" ]

[dependencies]
embedded-graphics = { workspace = true }
u8g2-fonts = "0.7"
heapless = "0.8.0"
defmt = { version = "0.3", optional = true }
# Must be the same source as the one the firmware's embassy-stm32 pulls in. A
# crates.io `embassy-time` would resolve to a second copy with its own
# `embassy-time-driver` defaulting to tick-hz-1_000_000, while the firmware runs
# tick-hz-32_768 — every staleness timeout here would silently be ~30x too
# long, with no build error.
embassy-time = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0" }
tokio = { version = "1.43.0", features = [ "full" ], optional = true }
eoi-can-decoder = { path = "../eoi-can-decoder" }
mppt-layout = { path = "../mppt-layout" }

[dev-dependencies]
# Only to hand-build CAN frames in tests, so the decode path is covered end to end.
embedded-can = { workspace = true }
# `test-util` for a paused clock: the staleness rules are the point of several
# tests, and they have to be checked by moving time rather than by sleeping.
# Kept out of the normal dependency so it cannot reach a shipped build.
tokio = { version = "1.43.0", features = [ "test-util" ] }
