[package]
name = "draw-display"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
built = { version = "0.8", features = [ "git2" ] }

[features]
# `std` is opt-in rather than default: this workspace builds for the embedded
# target, so a default that pulls in tokio would break `cargo build --workspace`.
# Host-side test runs need it: `cargo test -p draw-display --features std --target x86_64-unknown-linux-gnu`.
default = [ ]
defmt = [ "dep:defmt", "eoi-can-decoder/defmt" ]
std = [ "tokio" ]
tokio = [ "dep:tokio" ]

[dependencies]
embedded-graphics = "0.8.1"
u8g2-fonts = "0.7"
heapless = "0.8.0"
defmt = { version = "0.3", optional = true }
# Must be the same source as the one embassy-stm32 pulls in. A crates.io
# `embassy-time` would resolve to a second copy with its own `embassy-time-driver`
# defaulting to tick-hz-1_000_000, while the firmware runs tick-hz-32_768 — every
# staleness timeout here would silently be ~30x too long, with no build error.
embassy-time = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0" }
tokio = { version = "1.43.0", features = [ "full" ], optional = true }
# Same git URL and ref as the app's dependency, so cargo resolves one copy and
# the `EoiCanData` types match across the crate boundary.
eoi-can-decoder = { git = "ssh://git@github.com/Engineers-of-Innovation/eoi-can.git", branch = "feat/5in79-display" }
mppt-layout = { git = "ssh://git@github.com/Engineers-of-Innovation/eoi-can.git", branch = "feat/5in79-display" }

[dev-dependencies]
# Only to hand-build CAN frames in tests, so the decode path is covered end to end.
embedded-can = "0.4.1"
