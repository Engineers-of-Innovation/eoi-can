name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsdl2-dev
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install toolchain with required components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check formatting of Rust code with rustfmt
        uses: actions-rust-lang/rustfmt@v1
        with:
          manifest-path: ./Cargo.toml

      - name: Check formatting of Rust firmware code with rustfmt
        uses: actions-rust-lang/rustfmt@v1
        with:
          manifest-path: firmware/Cargo.toml

      - name: Check formatting of flash-tool code with rustfmt
        uses: actions-rust-lang/rustfmt@v1
        with:
          manifest-path: firmware/flash-tool/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsdl2-dev
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install toolchain with required components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Workspace clippy
        uses: LoliGothick/clippy-check@v0.3.1
        with:
          name: clippy-workspace
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .
          options: --all-targets
          deny: warnings

      # boot needs exactly one board feature, so the firmware workspace is
      # linted per package instead of with --workspace. No --all-targets:
      # test harnesses cannot build for the no_std thumb target.
      - name: Firmware clippy
        working-directory: firmware
        run: |
          cargo clippy -p eoi-firmware -- -D warnings
          cargo clippy -p eoi-boot-api -- -D warnings
          for board in rudder-controller height-sensor-controller dashboard; do
            cargo clippy -p eoi-boot --features $board -- -D warnings
          done

      - name: Flash-tool clippy
        working-directory: firmware/flash-tool
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsdl2-dev
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install toolchain with required components
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run all tests
        run: cargo nextest run
        working-directory: .

      - name: Run boot-api host tests
        run: cargo test -p eoi-boot-api --target x86_64-unknown-linux-gnu
        working-directory: firmware

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsdl2-dev
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install toolchain with required components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "nightly"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install cargo fuzz
        run: cargo binstall cargo-fuzz --no-confirm --target x86_64-unknown-linux-gnu # Give target otherwise it install the musl target

      - name: Try run the fuzzers
        run: |
          for name in $(cargo fuzz list)
          do
            cargo fuzz run $name -- -runs=1000000
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsdl2-dev
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install toolchain with required components
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: flip-link

      - name: Build
        run: cargo build
        working-directory: .

      - name: Build firmware (dev linker layout)
        run: DEFMT_LOG=trace cargo build --bins
        working-directory: firmware

      - name: Build firmware (bootloader layout)
        run: DEFMT_LOG=trace cargo build --bins --features bootloader
        working-directory: firmware

      - name: Build bootloader for every board variant
        working-directory: firmware
        run: |
          for board in rudder-controller height-sensor-controller dashboard; do
            DEFMT_LOG=trace cargo build -p eoi-boot --features $board
          done

      - name: Build flash-tool
        run: cargo build
        working-directory: firmware/flash-tool
