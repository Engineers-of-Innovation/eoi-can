[package]
name = "eoi-foil-view"
description = "Live attitude, ride height and foil angles on the datalogger's LCD, drawn from the hydrofoil CAN frames."
version = "0.1.0"
edition = "2024"

[features]
# An SDL window for working on the layout on a desktop. Off for the Pi, which draws
# straight to /dev/fb0 (and has no SDL to link against in the cross image).
window = [ "dep:sdl2" ]

[dependencies]
eoi-can-decoder = { path = "../eoi-can-decoder" }

tiny-skia = "0.11.4"
ab_glyph = "0.2.32"
ttf-parser = "0.25.1"
serde = { version = "1.0", features = [ "derive" ] }
toml = "0.8"
framebuffer = "0.3.1"
sdl2 = { version = "0.37.0", optional = true }

clap.workspace = true
socketcan.workspace = true
embedded-can.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
