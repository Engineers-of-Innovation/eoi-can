[package]
name = "eoi-firmware-foiling"
version = "0.1.0"
edition = "2024"

# The foiling display board: an STM32L476RG, where the rest of the fleet is an
# STM32L471RG. A separate crate purely because a Cargo feature cannot differ per
# binary within a package, and the chip is a feature — see `../common/Cargo.toml`
# for what that means for building.
#
# The board is the same design as the helm dashboard, so everything except the
# layout comes from `eoi-firmware-common`. L476RG is a peripheral superset of
# L471RG with the same 1 MB flash and LQFP64 pinout, so the shared linker scripts
# apply unchanged. The one pinout difference is pin 48, VDD on the L471 and
# VDDUSB on the L476; the board ties it to 3v3, which is in range for both.

[[bin]]
name = "foiling"
path = "src/bin/foiling.rs"

[build-dependencies]
eoi-build-support = { path = "../build-support" }

[features]
default = [  ]
# Link the application at the bootloader app offset (0x08014800). Off by default
# here, unlike the L471 crate: no bootloader is deployed on this board yet, so it
# is flashed over SWD at 0x08000000. See `firmware/docs/`.
bootloader = [  ]

[dependencies]
eoi-firmware-common = { path = "../common" }
# This is where the chip is chosen for this board.
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0", features = [ "stm32l476rg", "defmt", "memory-x", "unstable-pac", "time-driver-tim4", "exti" ] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0", features = [ "platform-cortex-m", "executor-thread", "defmt" ] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", tag = "embassy-stm32-v0.6.0", features = [ "defmt-timestamp-uptime", "tick-hz-32_768" ] }
panic-probe = { version = "1.0.0", features = [ "print-defmt" ] }
cortex-m = { version = "0.7.7", features = [ "critical-section-single-core" ] }
cortex-m-rt = "0.7.0"
defmt = "0.3.10"
defmt-rtt = "0.4"
eoi-boot-api = { path = "../boot-api" }
draw-display = { path = "../../draw-display", default-features = false, features = [ "defmt" ] }
