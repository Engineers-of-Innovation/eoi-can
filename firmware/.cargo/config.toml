[target.'cfg(all(target_arch = "arm", target_os = "none"))']

# Dispatches to probe-rs (default, same flags as before) or, under WSL, to the
# Windows-side J-Link Commander. Path is resolved relative to this file, so it
# works from any directory in the workspace. See the script header for the
# FLASH_BACKEND override.
runner = "tools/flash-jlink.sh"

linker = "flip-link"

[build]
target = "thumbv7em-none-eabihf"

# defmt filters logs at compile time and defaults to ERROR when DEFMT_LOG is
# unset, which builds a firmware that says nothing over RTT. Default to info so
# `cargo run`/`attach.sh` show the boot banner, sensor lines and servo state
# without anyone having to remember the variable. Cargo does not force this
# over an existing value, so `DEFMT_LOG=trace cargo run` (TMC UART errors,
# ignored setpoints) and `DEFMT_LOG=error` (lean production image) still win.
[env]
DEFMT_LOG = "info"
