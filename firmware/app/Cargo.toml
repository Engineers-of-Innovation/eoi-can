[package]
name = "eoi-firmware"
version = "0.1.0"
edition = "2024"

# The STM32L471RG boards: rudder controller, height sensor controller, and the
# helm dashboard. The foiling display is a separate crate because it is an
# STM32L476RG and the chip feature cannot differ per binary -- see
# `../common/Cargo.toml`.

[[bin]]
name = "height-sensor-controller"
path = "src/bin/height_sensor_controller.rs"

[[bin]]
name = "rudder-controller"
path = "src/bin/rudder_controller.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[build-dependencies]
eoi-build-support = { path = "../build-support" }

[features]
default = [  ]
# Link the application at the bootloader app offset (0x08014800).
# Without this feature, the app uses the full flash starting at 0x08000000.
bootloader = [  ]

[dependencies]
eoi-firmware-common = { path = "../common" }
# This is where the chip is chosen for these three boards. Cargo unifies it onto
# `eoi-firmware-common`'s copy of embassy-stm32, which names no chip itself.
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0", features = [ "stm32l471rg", "defmt", "memory-x", "unstable-pac", "time-driver-tim4", "exti" ] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0", features = [ "platform-cortex-m", "executor-thread", "defmt" ] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", tag = "embassy-stm32-v0.6.0" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", tag = "embassy-stm32-v0.6.0", features = [ "defmt-timestamp-uptime", "tick-hz-32_768" ] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", tag = "embassy-stm32-v0.6.0", features = [ "defmt" ] }
panic-probe = { version = "1.0.0", features = [ "print-defmt" ] }
cortex-m = { version = "0.7.7", features = [ "critical-section-single-core" ] }
cortex-m-rt = "0.7.0"
defmt = "0.3.10"
defmt-rtt = "0.4"
static_cell = "2.1.1"
heapless = "0.9"
eoi-boot-api = { path = "../boot-api" }
eoi-can-decoder = { path = "../../eoi-can-decoder", features = [ "defmt" ] }
embedded-can = "0.4.1"
draw-display = { path = "../../draw-display", default-features = false, features = [ "defmt" ] }
epd-waveshare = { git = "https://github.com/fromeijn/epd-waveshare", rev = "6ec511e9656fad59c2256713ed1ecb451e346ddb", default-features = false, features = [ "graphics", "epd2in13_v3" ] }
embedded-graphics = "0.8.1"
embedded-hal-bus = { version = "0.3", features = [ "async" ] }
rmodbus = { version = "0.12", default-features = false, features = [ "heapless" ] }
tmc2209 = "0.2.2"
nb = "1.1.0"
libm = "0.2"
