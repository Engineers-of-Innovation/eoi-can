[workspace]
resolver = "3"
members = ["app", "boot", "boot-api", "draw-display"]
exclude = ["flash-tool"]
default-members = ["app"]

[profile.release]
lto = true
debug = true
opt-level = "z"

# The display redraw is the longest stretch of uninterrupted CPU work in the
# dashboard binary, and it runs between CAN drains — its speed bounds how deep
# the RX buffer has to be. Flash headroom in the app partition is ample.
[profile.release.package.draw-display]
opt-level = 3

[profile.dev]
opt-level = "z"
lto = true
